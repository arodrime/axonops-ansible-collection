---
# repository
axon_agent_public_repository: present
axon_agent_beta_repository: absent
axon_agent_dev_repository: absent

# Package repository. Set axonops_manage_repository to false when the host already
# has the AxonOps package source configured (for example an internal mirror set up
# outside this role): the role then neither adds the repository nor fetches its key.
axonops_manage_repository: true
# apt source line; point it to an internal mirror for air-gapped hosts.
axonops_debian_repository: "deb https://packages.axonops.com/apt axonops-apt main"
# URL of the key that signs the apt repository; the source line then gets a signed-by
# option. Leave empty to use axonops_debian_repository exactly as written.
axonops_debian_repository_key_url: "https://packages.axonops.com/apt/repo-signing-key.gpg"
# yum baseurl (RedHat family).
axonops_redhat_repository: "https://packages.axonops.com/yum"

cqlai_version: latest
#cqlai_package_url: "https://downloads.datastax.com/cqlai/{{ cqlai_version }}/cqlai-{{ cqlai_version }}-all.deb"

cqlai_host: "127.0.0.1"
cqlai_port: 9042
cqlai_keyspace: ""
# cqlai_username: "cassandra"
# cqlai_password: "cassandra"
cqlai_require_confirmation: true
cqlai_consistency: "LOCAL_ONE"
cqlai_page_size: 100
cqlai_history_file: "~/.cqlai/history"
cqlai_ai_history_file: "~/.cqlai/ai_history"
cqlai_ssl_enabled: true
cqlai_ssl_cert_path: "/opt/ssl/{{ inventory_hostname }}.crt"
cqlai_ssl_key_path: "/opt/ssl/{{ inventory_hostname }}.key"
cqlai_ssl_ca_path: ""
cqlai_ssl_host_verification: false
cqlai_ssl_insecure_skip_verify: true
cqlai_ai_provider: "openai"
cqlai_ai_openai_api_key: ""
