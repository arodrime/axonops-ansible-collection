---
- name: Converge
  hosts: all
  vars:
    axon_agent_customer_name: molecule
  pre_tasks:
    - name: Fake cassandra service user, not in the axonops group
      ansible.builtin.user:
        name: cassandra
        system: true
        create_home: false
    - name: Fake cassandra conf
      ansible.builtin.file:
        path: /opt/cassandra/conf
        state: directory
        recurse: true
    - name: Fake cassandra-env for a full test
      ansible.builtin.copy:
        dest: /opt/cassandra/conf/cassandra-env.sh
        mode: "0644"
        content: |
          if [ "x$MX4J_PORT" != "x" ]; then
              if [ "$(echo "$MX4J_PORT" | grep -c "\-Dmx4jport")" = "1" ]; then
                  # Backward compatible with the older style #13578
                  JVM_OPTS="$JVM_OPTS $MX4J_PORT"
              else
                  JVM_OPTS="$JVM_OPTS -Dmx4jport=$MX4J_PORT"
              fi
          fi

          JVM_OPTS="$JVM_OPTS $JVM_EXTRA_OPTS"
          # Pre-existing OLD-method AxonOps line (ASB-4712): switching to the
          # options-file method must replace this, not append a second line.
          JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra5.0-agent-jdk17.jar=/etc/axonops/axon-agent.yml"
  roles:
    - role: agent
      vars:
        axon_java_agent: "axon-cassandra5.0-agent-jdk17"
        axon_agent_version: "2.0.21"
        axon_java_agent_version: "1.0.10"
        axon_agent_cassandra_config_directory: /opt/cassandra/conf
        axon_agent_cassandra_config: '. /usr/share/axonops/axonops-jvm.options'
  post_tasks:
    - name: Read back cassandra-env.sh
      ansible.builtin.command: cat /opt/cassandra/conf/cassandra-env.sh
      register: _cass_env_out
      changed_when: false

    - name: Assert exactly one AxonOps agent line and it is the options file (ASB-4712)
      ansible.builtin.assert:
        that:
          - _cass_env_out.stdout_lines | select('search', 'axonops') | list | length == 1
          - "'. /usr/share/axonops/axonops-jvm.options' in _cass_env_out.stdout_lines"
        fail_msg: >-
          Expected a single AxonOps line sourcing axonops-jvm.options; got:
          {{ _cass_env_out.stdout_lines | select('search', 'axonops') | list }}

    - name: Stat the agent config
      ansible.builtin.stat:
        path: /etc/axonops/axon-agent.yml
      register: _agent_cfg

    - name: Assert the agent config (holds the key) is not world-readable
      ansible.builtin.assert:
        that:
          - _agent_cfg.stat.exists
          - _agent_cfg.stat.mode == '0640'
          - _agent_cfg.stat.pw_name == 'axonops'
          - _agent_cfg.stat.gr_name == 'axonops'
        fail_msg: >-
          Expected /etc/axonops/axon-agent.yml axonops:axonops 0640; got
          {{ _agent_cfg.stat.pw_name | default('?') }}:{{ _agent_cfg.stat.gr_name | default('?') }}
          {{ _agent_cfg.stat.mode | default('?') }}

    - name: Read the axonops group
      ansible.builtin.getent:
        database: group
        key: axonops

    - name: Assert the cassandra user can read the agent config through the axonops group
      ansible.builtin.assert:
        that:
          - "'cassandra' in ansible_facts.getent_group.axonops[2].split(',')"
        fail_msg: "cassandra not in the axonops group: {{ ansible_facts.getent_group.axonops }}"

# code: language=ansible
