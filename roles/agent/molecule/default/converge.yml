---
- name: Converge
  hosts: all
  vars:
    axon_agent_customer_name: molecule
  pre_tasks:
    - name: Fake cassandra conf
      ansible.builtin.file:
        path: /opt/cassandra/conf
        state: directory
        recurse: true
    - name: Fake cassandra-env for a full test
      ansible.builtin.copy:
        dest: /opt/cassandra/conf/cassandra-env.sh
        mode: "0644"
        content: |
          if [ "x$MX4J_PORT" != "x" ]; then
              if [ "$(echo "$MX4J_PORT" | grep -c "\-Dmx4jport")" = "1" ]; then
                  # Backward compatible with the older style #13578
                  JVM_OPTS="$JVM_OPTS $MX4J_PORT"
              else
                  JVM_OPTS="$JVM_OPTS -Dmx4jport=$MX4J_PORT"
              fi
          fi

          JVM_OPTS="$JVM_OPTS $JVM_EXTRA_OPTS"
          # Duplicate left by older role versions (line appended without a
          # regexp after axon_agent_cassandra_config changed): must be removed too.
          JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra4.1-agent.jar=/etc/axonops/axon-agent.yml"
          # Pre-existing OLD-method AxonOps line (ASB-4712): switching to the
          # options-file method must replace this, not append a second line.
          JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra5.0-agent-jdk17.jar=/etc/axonops/axon-agent.yml"
          # old: JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra4.0-agent.jar=/etc/axonops/axon-agent.yml"
    - name: Fake second cassandra conf (one live old line, then a commented one)
      ansible.builtin.file:
        path: /opt/cassandra-b/conf
        state: directory
        mode: "0755"
    - name: Fake cassandra-env with a commented AxonOps line after the live one
      ansible.builtin.copy:
        dest: /opt/cassandra-b/conf/cassandra-env.sh
        mode: "0644"
        content: |
          JVM_OPTS="$JVM_OPTS $JVM_EXTRA_OPTS"
          JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra4.1-agent.jar=/etc/axonops/axon-agent.yml"
          # old: JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra4.1-agent.jar=/etc/axonops/axon-agent.yml"
    - name: Fake cassandra conf rendered by the cassandra role (must be left alone)
      ansible.builtin.file:
        path: /opt/cassandra-c/conf
        state: directory
        mode: "0755"
    - name: Fake cassandra-env with the cassandra role's agent block
      ansible.builtin.copy:
        dest: /opt/cassandra-c/conf/cassandra-env.sh
        mode: "0644"
        content: |
          JVM_OPTS="$JVM_OPTS $JVM_EXTRA_OPTS"
          if [ -f /usr/share/axonops/axonops-jvm.options ]; then
              . /usr/share/axonops/axonops-jvm.options
          else
              JVM_OPTS="$JVM_OPTS -javaagent:/usr/share/axonops/axon-cassandra5.0-agent-jdk17.jar=/etc/axonops/axon-agent.yml"
          fi
  roles:
    - role: agent
      vars:
        axon_java_agent: "axon-cassandra5.0-agent-jdk17"
        axon_agent_version: "2.0.21"
        axon_java_agent_version: "1.0.10"
        axon_agent_cassandra_config_directory: /opt/cassandra/conf
        axon_agent_cassandra_config: '. /usr/share/axonops/axonops-jvm.options'
  post_tasks:
    - name: Read back cassandra-env.sh
      ansible.builtin.command: cat /opt/cassandra/conf/cassandra-env.sh
      register: _cass_env_out
      changed_when: false

    - name: Assert exactly one live AxonOps agent line and it is the options file (ASB-4712)
      ansible.builtin.assert:
        that:
          - _cass_env_out.stdout_lines | select('match', '[^#]*axonops') | list | length == 1
          - "'. /usr/share/axonops/axonops-jvm.options' in _cass_env_out.stdout_lines"
          - _cass_env_out.stdout_lines | select('match', '# old:.*axon-cassandra4.0-agent') | list | length == 1
        fail_msg: >-
          Expected a single live AxonOps line sourcing axonops-jvm.options and the
          commented line kept; got:
          {{ _cass_env_out.stdout_lines | select('search', 'axonops') | list }}

    - name: Run the agent configuration on the second and third fixtures
      ansible.builtin.include_role:
        name: agent
        tasks_from: configure
      vars:
        axon_java_agent: "axon-cassandra5.0-agent-jdk17"
        axon_agent_cassandra_config_directory: "{{ item }}"
        axon_agent_cassandra_config: '. /usr/share/axonops/axonops-jvm.options'
      loop:
        - /opt/cassandra-b/conf
        - /opt/cassandra-c/conf

    - name: Read back the second and third fixtures
      ansible.builtin.slurp:
        src: "/opt/cassandra-{{ item }}/conf/cassandra-env.sh"
      register: _cass_env_bc
      loop: [b, c]

    - name: Assert the live line was replaced and the comment kept
      ansible.builtin.assert:
        that:
          - _b | length == 3
          - _b[1] == '. /usr/share/axonops/axonops-jvm.options'
          - _b[2] is match('# old:.*axon-cassandra4.1-agent')
        fail_msg: "Unexpected /opt/cassandra-b/conf/cassandra-env.sh: {{ _b }}"
      vars:
        _b: "{{ (_cass_env_bc.results[0].content | b64decode).splitlines() }}"

    - name: Assert the cassandra role's agent block was left alone
      ansible.builtin.assert:
        that:
          - (_cass_env_bc.results[1].content | b64decode).splitlines() | length == 6
          - (_cass_env_bc.results[1].content | b64decode).splitlines()[-1] == 'fi'
        fail_msg: "/opt/cassandra-c/conf/cassandra-env.sh was modified"

# code: language=ansible
