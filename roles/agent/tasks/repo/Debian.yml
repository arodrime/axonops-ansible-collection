---
# An offline install (has_internet_access: false) copies the packages, so it
# needs no repository and must not run apt-get update against unreachable sources.
- name: Manage the AxonOps apt repository
  when:
    - axonops_manage_repository | bool
    - has_internet_access | bool
  block:
    - name: Ensure pre-req gnupg is installed
      ansible.builtin.apt:
        name: ['gnupg', 'apt-transport-https', 'debian-archive-keyring']
        state: present
        update_cache: true

    - name: Install the AxonOps apt repository signing key
      when: axonops_debian_repository_key_url | length > 0
      block:
        - name: Ensure keyrings directory exists
          ansible.builtin.file:
            path: /usr/share/keyrings
            state: directory
            mode: '0755'

        - name: Download AxonOps apt repository key
          ansible.builtin.get_url:
            url: "{{ axonops_debian_repository_key_url }}"
            dest: /tmp/axonops-repo-signing-key.gpg
            mode: '0644'
          register: _axonops_repo_key

        - name: Check the AxonOps keyring
          ansible.builtin.stat:
            path: /usr/share/keyrings/axonops-archive-keyring.gpg
          register: _axonops_keyring

        # Rewritten when the downloaded key changes, so a new key URL takes effect.
        - name: Dearmor and save the AxonOps key
          ansible.builtin.command:
            cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/axonops-archive-keyring.gpg /tmp/axonops-repo-signing-key.gpg
          when: _axonops_repo_key is changed or not _axonops_keyring.stat.exists
          changed_when: true

        - name: Set correct permissions on AxonOps keyring file
          ansible.builtin.file:
            path: /usr/share/keyrings/axonops-archive-keyring.gpg
            mode: '0644'
            owner: root
            group: root

    - name: Set AxonOps apt repository to {{ axon_agent_public_repository }}.
      ansible.builtin.apt_repository:
        # With a key URL the line gets the signed-by option, otherwise it is used as written.
        repo: >-
          {{ axonops_debian_repository | regex_replace('^deb ', 'deb [signed-by=/usr/share/keyrings/axonops-archive-keyring.gpg] ')
             if axonops_debian_repository_key_url | length > 0 else axonops_debian_repository }}
        state: "{{ axon_agent_public_repository }}"
        update_cache: true

    - name: Set AxonOps beta apt repository to {{ axon_agent_beta_repository }}.
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/axonops-archive-keyring.gpg] https://packages.axonops.com/apt axonops-apt-beta main"
        state: "{{ axon_agent_beta_repository }}"
        update_cache: true

    - name: Set AxonOps dev apt repository to {{ axon_agent_dev_repository }}.
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/axonops-archive-keyring.gpg] https://packages.axonops.com/apt axonops-apt-dev main"
        state: "{{ axon_agent_dev_repository }}"
        update_cache: true

# It is required for when you're updating versions
- name: Run the equivalent of "apt-get update" as a separate step
  ansible.builtin.package:
    update_cache: true
  when: has_internet_access | bool

- name: Set package names
  ansible.builtin.set_fact:
    axon_agent_pkg: "axon-agent={{ axon_agent_version }}"
    axon_java_agent_pkg: "{{ axon_java_agent }}={{ axon_java_agent_version }}"
    pkg_ext: "deb"
  when: axon_agent_version != ""

- name: Set package names
  ansible.builtin.set_fact:
    axon_agent_pkg: "axon-agent"
    axon_java_agent_pkg: "{{ axon_java_agent }}"
    pkg_ext: "deb"
  when: axon_agent_version == ""

# code: language=ansible
