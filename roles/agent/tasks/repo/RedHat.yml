---
- name: Add AxonOps noarch yum repository
  ansible.builtin.yum_repository:
    description: "AxonOps NoArch Repository"
    name: axonops-yum-noarch
    baseurl: "{{ axon_agent_redhat_repository | default('https://packages.axonops.com/yum') }}"
    repo_gpgcheck: false
    gpgcheck: false

# Each pin applies on its own: axon_agent_version pins axon-agent,
# axon_java_agent_version pins the Java agent. Empty means latest.
- name: Set package names
  ansible.builtin.set_fact:
    axon_agent_pkg: >-
      axon-agent{{ ('-' ~ axon_agent_version ~ '-1') if (axon_agent_version | default('') | string | length > 0) else '' }}
    axon_java_agent_pkg: >-
      {{ axon_java_agent }}{{ ('-' ~ axon_java_agent_version ~ '-1') if (axon_java_agent_version | default('') | string | length > 0) else '' }}
    pkg_ext: "{{ ansible_architecture }}.rpm"

# code: language=ansible
