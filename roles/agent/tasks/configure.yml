---

# The Java agent inside the Cassandra/Kafka JVM reads axon-agent.yml. When the
# file is not world-readable, the service user needs the axonops group or the
# JVM fails to load the agent at its next start.
- name: Let the Cassandra/Kafka users read the agent config
  # Octal mode (string, or integer from an unquoted 0640): check the "other"
  # digit. Symbolic modes: always add the membership, it is harmless.
  when: >-
    (('%o' % axon_agent_config_mode) if axon_agent_config_mode is integer
     else (axon_agent_config_mode | string))[-1] not in ['4', '5', '6', '7']
  block:
    # Local accounts only (/etc/passwd): usermod cannot change directory
    # (LDAP/SSSD) users, whose group membership must be managed there.
    - name: List local users
      ansible.builtin.getent:
        database: passwd
        service: files

    - name: Add existing Cassandra/Kafka users to the axonops group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: axonops
        append: true
      loop: "{{ axon_agent_config_reader_users | select('in', ansible_facts.getent_passwd) | list }}"

- name: Copy AxonOps agent config file
  notify: Restart axon-agent
  ansible.builtin.template:
    src: axon-agent.yml.j2
    dest: /etc/axonops/axon-agent.yml
    owner: axonops
    group: axonops
    # Holds the agent key: not world-readable. The Java agent inside the
    # Cassandra/Kafka JVM reads it too, via membership of the axonops group.
    mode: "{{ axon_agent_config_mode }}"

- name: Make sure axon-agent.service.d directory is present if needed
  ansible.builtin.file:
    path: /etc/systemd/system/axon-agent.service.d/
    state: directory
    mode: "0755"
  when: axon_agent_limitnofile is defined and axon_agent_limitnofile != ''

- name: Copy set limit_nofile id needed
  ansible.builtin.template:
    src: limit_nofile.conf.j2
    dest: /etc/systemd/system/axon-agent.service.d/limit_nofile.conf
    owner: root
    group: root
    mode: "0644"
  when: axon_agent_limitnofile is defined and axon_agent_limitnofile != ''

- name: Create the agent_name file if it is DSE
  ansible.builtin.template:
    src: agent_service.j2
    dest: /var/lib/axonops/agent_service
    owner: axonops
    group: axonops
    mode: "0644"
  when: axon_java_agent == 'axon-dse6.0-agent' or axon_java_agent == 'axon-dse6.7-agent'

- name: Set hostId file if you have it
  ansible.builtin.template:
    src: hostId.j2
    dest: /var/lib/axonops/hostId
    owner: axonops
    group: axonops
    mode: "0644"
  notify:
    - delete local.db
    - Restart axon-agent
  when: axon_agent_hostid is defined and axon_agent_hostid != ''

- name: Set up sudoers if enabled
  ansible.builtin.copy:
    dest: /etc/sudoers.d/axonops
    content: "{{ axon_agent_sudoers }}"
    mode: "0600"
    owner: root
    group: root
  when: axon_agent_sudoers is defined and axon_agent_sudoers != ""

- name: Add AxonOps agent config to cassandra-env.sh
  when: axon_agent_cassandra_config_directory is defined and axon_agent_cassandra_config_directory != ""
  block:
    - name: Check the cassandra-env.sh can be found
      ansible.builtin.stat:
        path: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
      register: _cass_env

    - name: Fail if cassandra-env.sh not found
      ansible.builtin.fail:
        msg: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh not found"
      when: not _cass_env.stat.exists

    - name: Add AxonOps agent config to cassandra-env.sh
      ansible.builtin.lineinfile:
        path: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
        line: "{{ axon_agent_cassandra_config }}"
        # Match any existing AxonOps agent line (old raw -javaagent or new
        # axonops-jvm.options) so switching methods replaces it rather than
        # appending a second line and loading the agent twice.
        regexp: '(-javaagent:/usr/share/axonops/|\. /usr/share/axonops/axonops-jvm\.options)'
        insertafter: EOF

- name: Add AxonOps agent config to kafka-server-start.sh
  when: axon_agent_kafka_config_directory is defined and axon_agent_kafka_config_directory != ""
  block:
    - name: Check kafka-server-start.sh can be found
      ansible.builtin.stat:
        path: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh"
      register: _kafka_start

    - name: Fail if kafka-server-start.sh not found
      ansible.builtin.fail:
        msg: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh not found"
      when: not _kafka_start.stat.exists

    - name: Add AxonOps agent config to kafka-server-start.sh
      ansible.builtin.lineinfile:
        path: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh"
        line: "{{ axon_agent_kafka_config }}"
        regexp: '(axonops|axon-agent|axon-kafka)'
        insertbefore: "^exec "
        firstmatch: true

# code: language=ansible
