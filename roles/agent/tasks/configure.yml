---

- name: Copy AxonOps agent config file
  notify: Restart axon-agent
  ansible.builtin.template:
    src: axon-agent.yml.j2
    dest: /etc/axonops/axon-agent.yml
    owner: axonops
    group: axonops
    mode: "0644"

- name: Make sure axon-agent.service.d directory is present if needed
  ansible.builtin.file:
    path: /etc/systemd/system/axon-agent.service.d/
    state: directory
    mode: "0755"
  when: axon_agent_limitnofile is defined and axon_agent_limitnofile != ''

- name: Copy set limit_nofile id needed
  ansible.builtin.template:
    src: limit_nofile.conf.j2
    dest: /etc/systemd/system/axon-agent.service.d/limit_nofile.conf
    owner: root
    group: root
    mode: "0644"
  when: axon_agent_limitnofile is defined and axon_agent_limitnofile != ''

- name: Create the agent_name file if it is DSE
  ansible.builtin.template:
    src: agent_service.j2
    dest: /var/lib/axonops/agent_service
    owner: axonops
    group: axonops
    mode: "0644"
  when: axon_java_agent == 'axon-dse6.0-agent' or axon_java_agent == 'axon-dse6.7-agent'

- name: Set hostId file if you have it
  ansible.builtin.template:
    src: hostId.j2
    dest: /var/lib/axonops/hostId
    owner: axonops
    group: axonops
    mode: "0644"
  notify:
    - delete local.db
    - Restart axon-agent
  when: axon_agent_hostid is defined and axon_agent_hostid != ''

- name: Set up sudoers if enabled
  ansible.builtin.copy:
    dest: /etc/sudoers.d/axonops
    content: "{{ axon_agent_sudoers }}"
    mode: "0600"
    owner: root
    group: root
  when: axon_agent_sudoers is defined and axon_agent_sudoers != ""

- name: Add AxonOps agent config to cassandra-env.sh
  when: axon_agent_cassandra_config_directory is defined and axon_agent_cassandra_config_directory != ""
  vars:
    # A live (unindented, not commented) AxonOps agent line: the old raw
    # -javaagent line or the axonops-jvm.options include. Comments and indented
    # lines never match, so a commented-out old line is never rewritten and
    # the cassandra role's if/else block is never touched.
    _axon_agent_toplevel_line_re: '^([^\s#].*)?(-javaagent:/usr/share/axonops/|\. /usr/share/axonops/axonops-jvm\.options)'
    # The agent block rendered by this collection's cassandra role starts with
    # this (uncommented) line; such a file already loads the agent.
    _axon_agent_cassandra_role_marker_re: '^\s*if \[ -f /usr/share/axonops/axonops-jvm\.options \]'
    _axon_agent_cass_env_lines: "{{ (_cass_env_content.content | b64decode).splitlines() }}"
    _axon_agent_cassandra_role_managed: >-
      {{ _axon_agent_cass_env_lines | select('search', _axon_agent_cassandra_role_marker_re) | list | length > 0 }}
    _axon_agent_live_lines: "{{ _axon_agent_cass_env_lines | select('search', _axon_agent_toplevel_line_re) | list }}"
  block:
    - name: Check the cassandra-env.sh can be found
      ansible.builtin.stat:
        path: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
      register: _cass_env

    - name: Fail if cassandra-env.sh not found
      ansible.builtin.fail:
        msg: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh not found"
      when: not _cass_env.stat.exists

    - name: Read cassandra-env.sh
      ansible.builtin.slurp:
        src: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
      register: _cass_env_content

    # The cassandra role already loads the agent (and re-renders the file on
    # every run): adding a line here would load it twice.
    - name: Skip cassandra-env.sh managed by the cassandra role
      ansible.builtin.debug:
        msg: >-
          {{ axon_agent_cassandra_config_directory }}/cassandra-env.sh already loads the
          AxonOps agent (rendered by the cassandra role); leaving it unchanged.
          Unset axon_agent_cassandra_config_directory to silence this.
          {% if _axon_agent_live_lines | length > 0 %}It also has {{ _axon_agent_live_lines | length }}
          stray top-level AxonOps line(s) that load the agent a second time; remove them or
          re-render the file with the cassandra role: {{ _axon_agent_live_lines }}{% endif %}
      when: _axon_agent_cassandra_role_managed | bool

    # Older versions of this role appended the line without a regexp, so a
    # changed axon_agent_cassandra_config left several AxonOps lines (agent
    # loaded twice). The replace below only rewrites the last match, so drop
    # them all first when there is more than one; the next task re-adds one.
    - name: Remove duplicate AxonOps agent lines from cassandra-env.sh
      ansible.builtin.lineinfile:
        path: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
        regexp: "{{ _axon_agent_toplevel_line_re }}"
        state: absent
      when:
        - not (_axon_agent_cassandra_role_managed | bool)
        - _axon_agent_live_lines | length > 1

    - name: Add AxonOps agent config to cassandra-env.sh
      ansible.builtin.lineinfile:
        path: "{{ axon_agent_cassandra_config_directory }}/cassandra-env.sh"
        line: "{{ axon_agent_cassandra_config }}"
        # Replace any existing live AxonOps agent line (old raw -javaagent or
        # new axonops-jvm.options) so switching methods does not append a
        # second line and load the agent twice.
        regexp: "{{ _axon_agent_toplevel_line_re }}"
        insertafter: EOF
      when: not (_axon_agent_cassandra_role_managed | bool)

- name: Add AxonOps agent config to kafka-server-start.sh
  when: axon_agent_kafka_config_directory is defined and axon_agent_kafka_config_directory != ""
  block:
    - name: Check kafka-server-start.sh can be found
      ansible.builtin.stat:
        path: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh"
      register: _kafka_start

    - name: Fail if kafka-server-start.sh not found
      ansible.builtin.fail:
        msg: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh not found"
      when: not _kafka_start.stat.exists

    - name: Add AxonOps agent config to kafka-server-start.sh
      ansible.builtin.lineinfile:
        path: "{{ axon_agent_kafka_config_directory }}/kafka-server-start.sh"
        line: "{{ axon_agent_kafka_config }}"
        regexp: '(axonops|axon-agent|axon-kafka)'
        insertbefore: "^exec "
        firstmatch: true

# code: language=ansible
