---
- name: Set package name with version for Debian
  ansible.builtin.set_fact:
    axon_server_versioned_package: "axon-server={{ axon_server_version }}"
  when:
    - ansible_os_family == 'Debian'
    - axon_server_version is defined
    - axon_server_version != 'latest'

- name: Set package name with version for RedHat
  ansible.builtin.set_fact:
    axon_server_versioned_package: "axon-server-{{ axon_server_version }}"
  when:
    - ansible_os_family == 'RedHat'
    - axon_server_version is defined
    - axon_server_version != 'latest'

- name: Set package name without version (for latest)
  ansible.builtin.set_fact:
    axon_server_versioned_package: "axon-server"
  when:
    - axon_server_version is not defined or axon_server_version == 'latest'

- name: Ensure Axon server is installed.
  when: ansible_os_family == "Debian" and (has_internet_access or axon_server_state == "absent")
  ansible.builtin.apt:
    name: "{{ axon_server_versioned_package }}"
    state: "{{ axon_server_state }}"
  notify:
    - restart axon-server

- name: Ensure Axon server is installed.
  when: ansible_os_family == "RedHat" and (has_internet_access or axon_server_state == "absent")
  ansible.builtin.package:
    name: "{{ axon_server_versioned_package }}"
    state: "{{ axon_server_state }}"
    enablerepo: "axonops*"
    disablerepo: "*"
  notify:
    - restart axon-server

# Offline installation: copy the package from the control node and install it.
- name: Offline installation of the AxonOps server
  when: not has_internet_access and axon_server_state == "present"
  block:
    - name: Check the offline installation settings
      ansible.builtin.assert:
        that:
          - axon_server_download_path is defined
          - axon_server_version is defined
          - axon_server_version not in ['', 'latest']
        fail_msg: "An offline installation needs axon_server_download_path and a pinned axon_server_version."

    - name: Set the AxonOps server package file name
      ansible.builtin.set_fact:
        _axon_server_pkg_file: "/tmp/axon-server-{{ axon_server_version }}.{{ 'deb' if ansible_os_family == 'Debian' else 'rpm' }}"

    - name: Copy AxonOps server package to target
      ansible.builtin.copy:
        src: "{{ axon_server_download_path }}"
        dest: "{{ _axon_server_pkg_file }}"
        mode: "0644"
        owner: root
        group: root

    - name: Install AxonOps server offline (rpm)
      ansible.builtin.package:
        name: "{{ _axon_server_pkg_file }}"
        state: present
      when: ansible_os_family != "Debian"
      notify:
        - restart axon-server

    - name: Install AxonOps server offline (deb)
      ansible.builtin.apt:
        deb: "{{ _axon_server_pkg_file }}"
        state: present
      when: ansible_os_family == "Debian"
      notify:
        - restart axon-server

- name: Add systemd service override for axon-server when opensearch and cassandra are running on localhost
  when:
    - opensearch_network_host is defined and opensearch_network_host in ['localhost', '127.0.0.1']
    - cassandra_rpc_address is defined and cassandra_rpc_address in ['localhost', '127.0.0.1']
  block:
    - name: Create systemd override directory for axon-server
      ansible.builtin.file:
        path: /etc/systemd/system/axon-server.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add systemd service override for axon-server
      ansible.builtin.copy:
        dest: /etc/systemd/system/axon-server.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          After=network-online.target cassandra.service opensearch.service
          Wants=network-online.target
      notify:
        - Reload systemd

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Set axon_server_version fact from installed version
  ansible.builtin.set_fact:
    axon_server_version: >-
      {{ ansible_facts.packages['axon-server'][0].version
         if ansible_os_family == 'RedHat'
         else (ansible_facts.packages['axon-server'][0].version | split('-') | first) }}
  when:
    - axon_server_version == 'latest'
    - "'axon-server' in ansible_facts.packages"

# code: language=ansible
